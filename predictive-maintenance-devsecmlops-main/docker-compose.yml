# Starts the full stack:
#   app + API  -> http://localhost:8000   (web app; /docs for the raw API)
#   mlflow     -> http://localhost:5000   (experiments + model registry)
#   prometheus -> http://localhost:9090   (metrics scraping)
#   grafana    -> http://localhost:3000   (dashboards, login admin / see .env)

services:
  api:
    build: .
    image: predictive-maintenance-api:latest
    container_name: pm-api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - MLFLOW_UI_URL=http://localhost:5000
    volumes:
      - api-logs:/app/logs          # predictions + alerts survive restarts
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mlflow:
    image: predictive-maintenance-api:latest
    container_name: pm-mlflow
    depends_on: [api]
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pm-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: pm-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  api-logs:
